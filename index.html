    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20260228" />
    <link rel="shortcut icon" href="/favicon-32x32.png?v=20260228" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260228" />
    <link rel="manifest" href="/site.webmanifest?v=20260228" />

    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SFast Trucklog - บันทึกงานวิ่งรถ</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Light theme */
      .light {
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #1e293b;
        --muted: #64748b;
        --border: #e2e8f0;
      }

      /* Dark theme */
      .dark {
        --bg: #1a1b26;
        --card: #24283b;
        --text: #c0caf5;
        --muted: #565f89;
        --border: #414868;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--muted);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text);
      }

      /* Animations */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-fade-in {
        animation: fadeIn 0.3s ease-out;
      }

      /* Theme transition */
      .theme-transition {
        transition:
          background-color 0.3s ease,
          color 0.3s ease,
          border-color 0.3s ease;
      }
    </style>

        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
